<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tea Shop - GreenLeaf Tea Factory</title>
  <meta name="description" content="Browse and order premium Ceylon tea from GreenLeaf Tea Factory" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="nav">
        <a href="/" class="brand nav-brand-link">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <defs>
                <linearGradient id="shopLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#d8ff9a"/>
                  <stop offset="55%" stop-color="#54b948"/>
                  <stop offset="100%" stop-color="#1d6f34"/>
                </linearGradient>
              </defs>
              <path d="M31 8c-13 7-20 19-20 31 0 9 7 15 15 15 17 0 29-18 28-40-8 1-16 5-23 13 1-7 1-13 0-19Z" fill="url(#shopLeaf)"/>
            </svg>
          </div>
          <div><h1>GreenLeaf</h1><span class="tag">Tea Shop</span></div>
        </a>
        <nav class="links">
          <a href="/">Home</a>
          <a href="/src/pages/shop.html" class="active">Shop</a>
          <a href="/src/pages/cart.html">Cart <span id="cartBadge" class="cart-badge" style="display:none">0</span></a>
          <span id="authNav"></span>
        </nav>
      </div>
    </div>
  </header>

  <main class="section page-main">
    <div class="container">
      <h2>Our Premium Teas</h2>
      <p class="muted">Browse our collection of finest Ceylon teas, sourced directly from our factory.</p>

      <div class="shop-filters" id="filters">
        <input type="search" id="searchInput" placeholder="Search teas..." class="shop-search" />
        <select id="categoryFilter" class="shop-filter-select">
          <option value="">All Categories</option>
        </select>
        <select id="sortFilter" class="shop-filter-select">
          <option value="name">Sort by Name</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>

      <div class="shop-grid" id="productsGrid">
        <div class="shop-loading">Loading products...</div>
      </div>
    </div>
  </main>

  <script type="module" src="./shop.js"></script>
</body>
</html>
