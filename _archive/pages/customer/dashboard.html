<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard - GreenLeaf Tea Factory</title>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <a href="/" class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d8ff9a"/><stop offset="55%" stop-color="#54b948"/><stop offset="100%" stop-color="#1d6f34"/></linearGradient></defs><path d="M31 8c-13 7-20 19-20 31 0 9 7 15 15 15 17 0 29-18 28-40-8 1-16 5-23 13 1-7 1-13 0-19Z" fill="url(#lg)"/></svg>
        </div>
        <div>
          <h3>GreenLeaf</h3>
          <p>My Account</p>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a href="/src/pages/customer/dashboard.html" class="active"><span class="nav-icon" data-icon="DB"></span> Dashboard</a>
        <a href="/src/pages/shop.html"><span class="nav-icon" data-icon="SP"></span> Shop</a>
        <a href="/src/pages/cart.html"><span class="nav-icon" data-icon="CT"></span> Cart</a>
        <a href="/src/pages/customer/orders.html"><span class="nav-icon" data-icon="OD"></span> My Orders</a>
        <a href="/src/pages/customer/profile.html"><span class="nav-icon" data-icon="PF"></span> Profile</a>
        <a href="/"><span class="nav-icon" data-icon="HM"></span> Home</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="userAvatar">C</div>
          <div class="sidebar-user-info">
            <strong id="userName">Customer</strong>
            <span id="userRole">Customer</span>
          </div>
        </div>
        <button class="sidebar-logout" id="logoutBtn">Sign Out</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <div>
          <h1>My Dashboard</h1>
          <p id="greeting">Welcome!</p>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-icon green" data-icon="OD"></div>
          <h3 id="totalOrders">-</h3>
          <p>Total Orders</p>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue" data-icon="AC"></div>
          <h3 id="activeOrders">-</h3>
          <p>Active Orders</p>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange" data-icon="CT"></div>
          <h3 id="cartCount">-</h3>
          <p>Items in Cart</p>
        </div>
      </div>

      <div class="data-table-container">
        <div class="data-table-header">
          <h3>Recent Orders</h3>
          <a href="/src/pages/customer/orders.html" class="btn-action view">View All</a>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Order #</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recentOrdersBody">
            <tr><td colspan="4" class="table-empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
