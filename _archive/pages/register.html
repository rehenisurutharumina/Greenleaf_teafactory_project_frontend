<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - GreenLeaf Tea Factory</title>
  <meta name="description" content="Create your GreenLeaf Tea Factory account" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <a href="/" class="auth-logo">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <defs>
              <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d8ff9a" />
                <stop offset="55%" stop-color="#54b948" />
                <stop offset="100%" stop-color="#1d6f34" />
              </linearGradient>
            </defs>
            <path d="M31 8c-13 7-20 19-20 31 0 9 7 15 15 15 17 0 29-18 28-40-8 1-16 5-23 13 1-7 1-13 0-19Z" fill="url(#leafGradient)" />
            <path d="M21 38c8-6 16-12 28-15" fill="none" stroke="#ebffe0" stroke-linecap="round" stroke-width="3" />
            <path d="M28 28c-1 7-4 13-10 19" fill="none" stroke="#ebffe0" stroke-linecap="round" stroke-width="2.5" />
          </svg>
        </div>
        <span>GreenLeaf Tea Factory</span>
      </a>

      <h2>Create Account</h2>
      <p class="auth-subtitle">Join GreenLeaf and start ordering premium tea</p>

      <form id="registerForm" class="auth-form">
        <label>
          Full Name
          <input type="text" id="fullName" placeholder="Your full name" required minlength="2" />
        </label>

        <label>
          Email
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
        </label>

        <label>
          Phone <span class="optional">(optional)</span>
          <input type="tel" id="phone" placeholder="07XXXXXXXX" />
        </label>

        <label>
          Address <span class="optional">(optional)</span>
          <input type="text" id="address" placeholder="Your delivery address" />
        </label>

        <label>
          Register As
          <select id="role" required>
            <option value="Customer" selected>Customer</option>
            <option value="Staff">Staff</option>
          </select>
        </label>

        <label>
          Password
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
        </label>

        <label>
          Confirm Password
          <input type="password" id="confirmPassword" placeholder="Retype your password" required minlength="6" autocomplete="new-password" />
        </label>

        <button class="btn auth-btn" type="submit" id="submitBtn">
          <span id="btnText">Create Account</span>
          <span id="btnLoader" class="loader" style="display:none;"></span>
        </button>

        <p class="auth-msg" id="authMsg"></p>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="/src/pages/login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script type="module" src="./register.js"></script>
</body>
</html>
