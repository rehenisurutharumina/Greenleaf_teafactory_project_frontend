<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - GreenLeaf</title>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <a href="/" class="sidebar-brand"><div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d8ff9a"/><stop offset="55%" stop-color="#54b948"/><stop offset="100%" stop-color="#1d6f34"/></linearGradient></defs><path d="M31 8c-13 7-20 19-20 31 0 9 7 15 15 15 17 0 29-18 28-40-8 1-16 5-23 13 1-7 1-13 0-19Z" fill="url(#lg)"/></svg></div><div><h3>GreenLeaf</h3><p>My Account</p></div></a>
      <nav class="sidebar-nav">
        <a href="/src/pages/customer/dashboard.html"><span class="nav-icon" data-icon="DB"></span> Dashboard</a>
        <a href="/src/pages/shop.html"><span class="nav-icon" data-icon="SP"></span> Shop</a>
        <a href="/src/pages/cart.html"><span class="nav-icon" data-icon="CT"></span> Cart</a>
        <a href="/src/pages/customer/orders.html" class="active"><span class="nav-icon" data-icon="OD"></span> My Orders</a>
        <a href="/src/pages/customer/profile.html"><span class="nav-icon" data-icon="PF"></span> Profile</a>
        <a href="/"><span class="nav-icon" data-icon="HM"></span> Home</a>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar" id="userAvatar">C</div><div class="sidebar-user-info"><strong id="userName">Customer</strong><span>Customer</span></div></div><button class="sidebar-logout" id="logoutBtn">Sign Out</button></div>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-header"><div><h1>My Orders</h1><p>Track all your order history</p></div></div>
      <div class="data-table-container">
        <div class="data-table-header"><h3>Orders</h3></div>
        <table class="data-table">
          <thead><tr><th>Order #</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="ordersBody"><tr><td colspan="6" class="table-empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="orderModal">
    <div class="modal">
      <h3>Order Details</h3>
      <p class="form-help" id="orderMeta"></p>
      <div class="data-table-container">
        <table class="data-table">
          <thead><tr><th>Product</th><th>Qty (kg)</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
          <tbody id="orderItemsBody"></tbody>
        </table>
      </div>
      <div class="modal-actions"><button type="button" class="btn-cancel" id="closeOrderModal">Close</button></div>
    </div>
  </div>

  <script type="module" src="./orders.js"></script>
</body>
</html>
