<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks - GreenLeaf Staff</title>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <a href="/" class="sidebar-brand"><div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d8ff9a"/><stop offset="55%" stop-color="#54b948"/><stop offset="100%" stop-color="#1d6f34"/></linearGradient></defs><path d="M31 8c-13 7-20 19-20 31 0 9 7 15 15 15 17 0 29-18 28-40-8 1-16 5-23 13 1-7 1-13 0-19Z" fill="url(#lg)"/></svg></div><div><h3>GreenLeaf</h3><p>Staff Panel</p></div></a>
      <nav class="sidebar-nav">
        <a href="/src/pages/staff/dashboard.html"><span class="nav-icon" data-icon="DB"></span> Dashboard</a>
        <a href="/src/pages/staff/tasks.html" class="active"><span class="nav-icon" data-icon="TS"></span> My Tasks</a>
        <a href="/src/pages/staff/inventory.html"><span class="nav-icon" data-icon="IV"></span> Inventory</a>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-avatar" id="userAvatar">S</div><div class="sidebar-user-info"><strong id="userName">Staff</strong><span>Factory Staff</span></div></div><button class="sidebar-logout" id="logoutBtn">Sign Out</button></div>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <div><h1>My Tasks</h1><p>Update your assigned production tasks</p></div>
      </div>

      <div class="data-table-container">
        <div class="data-table-header">
          <h3>Assigned Tasks</h3>
          <div class="toolbar"><select id="taskStatusFilter"><option value="">All Statuses</option><option>Pending</option><option>InProgress</option><option>Completed</option></select></div>
        </div>
        <table class="data-table">
          <thead><tr><th>Task #</th><th>Type</th><th>Order</th><th>Status</th><th>Assigned</th><th>Actions</th></tr></thead>
          <tbody id="tasksBody"><tr><td colspan="6" class="table-empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="./tasks.js"></script>
</body>
</html>
